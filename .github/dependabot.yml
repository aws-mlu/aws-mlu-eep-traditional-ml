
# .github/dependabot.yml
# Dependabot configuration for aws-mlu-eep-traditional-ml
# Security updates only — no routine version bumps
# PRs require manual review and merge (no auto-merge)

version: 2
updates:
  # ============================================================
  # mlu-mlta (Machine Learning - The Algorithms)
  # ============================================================

  - package-ecosystem: "pip"
    directory: "/mlu-mlta/Labs/01-M1-Lab1_DataProcessing"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    versioning-strategy: "lockfile-only"
    labels:
      - "dependencies"
      - "security"
      - "mlu-mlta"
    commit-message:
      prefix: "security(mlta)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

