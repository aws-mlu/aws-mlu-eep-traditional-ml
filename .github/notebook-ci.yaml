name: Notebook CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.16'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          pip install -r requirements.txt

      - name: Execute notebooks end-to-end
        run: |
          find . -name "*.ipynb" -not -path '*/.*' -print0 | while IFS= read -r -d '' nb; do
            echo "Running $nb..."
            jupyter nbconvert --to notebook --execute --inplace "$nb"
          done
